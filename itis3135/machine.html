<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles/default.css">
    <link rel="stylesheet" href="styles/machine.css">
    <title>K Bathily's Brave Kudu ~ ITIS 3135 | Kudu Rhythm Machine</title>
</head>
<body>
    <div data-include="components/header.html"></div>

    <main>
        <h2>Kudu Rhythm Drum Machine</h2>
        <div id="drum-machine">
            <div id="pad-bank">
                <button class="drum-pad" id="Heater-1" type="button">Q
                    <audio class="clip" id="Q" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-1.mp3"></audio>
                </button>
                <button class="drum-pad" id="Heater-2" type="button">W
                    <audio class="clip" id="W" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-2.mp3"></audio>
                </button>
                <button class="drum-pad" id="Heater-3" type="button">E
                    <audio class="clip" id="E" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-3.mp3"></audio>
                </button>
                <button class="drum-pad" id="Heater-4" type="button">A
                    <audio class="clip" id="A" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-4_1.mp3"></audio>
                </button>
                <button class="drum-pad" id="Clap" type="button">S
                    <audio class="clip" id="S" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-6.mp3"></audio>
                </button>
                <button class="drum-pad" id="Open-HH" type="button">D
                    <audio class="clip" id="D" src="https://cdn.freecodecamp.org/curriculum/drum/Dsc_Oh.mp3"></audio>
                </button>
                <button class="drum-pad" id="Kick-n-Hat" type="button">Z
                    <audio class="clip" id="Z" src="https://cdn.freecodecamp.org/curriculum/drum/Kick_n_Hat.mp3"></audio>
                </button>
                <button class="drum-pad" id="Kick" type="button">X
                    <audio class="clip" id="X" src="https://cdn.freecodecamp.org/curriculum/drum/RP4_KICK_1.mp3"></audio>
                </button>
                <button class="drum-pad" id="Closed-HH" type="button">C
                    <audio class="clip" id="C" src="https://cdn.freecodecamp.org/curriculum/drum/Cev_H2.mp3"></audio>
                </button>
            </div>
            <p id="display">Press a key</p>
        </div>
    </main>

    <div data-include="components/footer.html"></div>
    <script src="Scripts/machine_html.js"></script>
    <script src="Scripts/htmlinclude.js"></script>
</body>
</html>
