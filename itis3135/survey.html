<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/default.css">
    <title>Bathily's Waraba ~ ITIS 3135 | Survey</title>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>
<body>
    <div data-include="components/header.html"></div>
    <main>
        <h2>Waraba Flavor Lab Survey</h2>
        <p id="description">Share preferences for upcoming flavors, merch, and campus pop-up events.</p>

        <form id="survey-form">
            <label id="name-label" for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label id="email-label" for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label id="number-label" for="number">How many flavor drops have you tried?</label>
            <input type="number" id="number" name="dropsTried" min="0" max="30" placeholder="0 to 30">

            <label for="dropdown">Favorite flavor family</label>
            <select id="dropdown" name="favoriteFamily">
                <option value="">Select one</option>
                <option value="sweet-spice">Sweet + Spice</option>
                <option value="smoky">Smoky Savanna</option>
                <option value="citrus">Citrus Heat</option>
                <option value="herbal">Herbal Chill</option>
            </select>

            <p>Would you recommend Waraba Flavor Lab?</p>
            <label><input type="radio" name="recommend" value="yes"> Yes</label>
            <label><input type="radio" name="recommend" value="maybe"> Maybe</label>
            <label><input type="radio" name="recommend" value="no"> No</label>

            <p>What should we launch next? (select all that apply)</p>
            <label><input type="checkbox" name="nextLaunch" value="late-night-box"> Late Night Snack Box</label>
            <label><input type="checkbox" name="nextLaunch" value="travel-kit"> Travel Tin Kit</label>
            <label><input type="checkbox" name="nextLaunch" value="recipe-zine"> Recipe Zine Vol. 2</label>

            <label for="comments">Special requests</label>
            <textarea id="comments" name="comments" placeholder="Tell us your dream flavor combo..."></textarea>

            <button id="submit" type="submit">Submit Survey</button>
        </form>
    </main>
    <div data-include="components/footer.html"></div>
    <script src="Scripts/htmlinclude.js"></script>
</body>
</html>
