<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/default.css">
    <title>Bathily's Brave Kudu ~ ITIS 3135 | Survey</title>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>
<body>
    <div data-include="components/header.html"></div>
    <main>
        <h2>Brave Kudu Safari Adventures Survey</h2>
        <p id="description">Help us improve your safari experience! Share your preferences for tours, wildlife sightings, and future adventures.</p>

        <form id="survey-form">
            <label id="name-label" for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label id="email-label" for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label id="number-label" for="number">How many safaris have you been on?</label>
            <input type="number" id="number" name="safarisAttended" min="0" max="50" placeholder="0 to 50">

            <label for="dropdown">Favorite African animal</label>
            <select id="dropdown" name="favoriteAnimal">
                <option value="">Select one</option>
                <option value="lion">Lion</option>
                <option value="elephant">Elephant</option>
                <option value="kudu">Kudu</option>
                <option value="giraffe">Giraffe</option>
                <option value="zebra">Zebra</option>
            </select>

            <p>Would you recommend Brave Kudu Safari Adventures?</p>
            <label><input type="radio" name="recommend" value="yes"> Yes</label>
            <label><input type="radio" name="recommend" value="maybe"> Maybe</label>
            <label><input type="radio" name="recommend" value="no"> No</label>

            <p>What add-ons interest you? (select all that apply)</p>
            <label><input type="checkbox" name="addons" value="photography"> Professional Photography</label>
            <label><input type="checkbox" name="addons" value="guide"> Private Guide</label>
            <label><input type="checkbox" name="addons" value="camping"> Luxury Camping</label>

            <label for="comments">Special requests or suggestions</label>
            <textarea id="comments" name="comments" placeholder="Tell us about your dream safari..."></textarea>

            <button id="submit" type="submit">Submit Survey</button>
        </form>
    </main>
    <div data-include="components/footer.html"></div>
    <script src="Scripts/htmlinclude.js"></script>
</body>
</html>
