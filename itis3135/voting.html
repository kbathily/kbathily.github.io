<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles/default.css">
    <link rel="stylesheet" href="styles/voting.css">
    <title>K Bathily's Brave Kudu ~ ITIS 3135 | Horn Council Voting</title>
</head>
<body>
    <div data-include="components/header.html"></div>

    <main>
        <h2>Brave Kudu Council Voting System</h2>

        <section class="panel" aria-label="Add option">
            <h3>Add Voting Option</h3>
            <label for="option-input">New Option</label>
            <input id="option-input" type="text" placeholder="Example: Ghana" />
            <button id="add-option-btn" type="button">Add Option</button>
        </section>

        <section class="panel" aria-label="Vote">
            <h3>Cast Vote</h3>
            <label for="vote-option">Option</label>
            <select id="vote-option"></select>
            <label for="voter-id">Voter ID</label>
            <input id="voter-id" type="text" placeholder="Example: traveler4" />
            <button id="vote-btn" type="button">Vote</button>
        </section>

        <section class="panel" aria-label="Results">
            <h3>Poll Results</h3>
            <button id="show-results-btn" type="button">Show Results</button>
            <pre id="results-output"></pre>
            <p id="voting-message" aria-live="polite"></p>
        </section>
    </main>

    <div data-include="components/footer.html"></div>
    <script src="Scripts/voting-system-html.js"></script>
    <script src="Scripts/htmlinclude.js"></script>
</body>
</html>
